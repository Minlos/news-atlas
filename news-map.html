<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disaster atlas — wildfires, floods, quakes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #efe6d6; --muted: #9b917f; --paper: #101218;
      --panel: rgba(22, 25, 34, .92); --line: #323848; --accent: #d4b07a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
      font-family: Georgia, "Iowan Old Style", Palatino, serif; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #101218; font-family: inherit; }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.3); }
    .panel {
      position: absolute; z-index: 500; top: 14px; left: 14px;
      width: min(400px, calc(100vw - 28px));
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 18px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
      max-height: calc(100vh - 28px); overflow: auto;
    }
    h1 { font-size: 1.28rem; font-weight: 600; margin: 0 2px 2px; }
    .sub { color: var(--muted); font-size: .8rem; line-height: 1.5; margin: 0 0 14px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: .75rem; color: var(--muted); }
    .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
    label { display: block; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin: 11px 0 5px; }
    select, button {
      width: 100%; background: #12141c; color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: .86rem;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { cursor: pointer; }
    .row button:hover { border-color: var(--accent); color: var(--accent); }
    .count { color: var(--accent); font-variant-numeric: tabular-nums; }
    .leaflet-popup-content-wrapper {
      background: #1a1d27; color: var(--ink); border-radius: 12px;
      border: 1px solid var(--line); max-width: 340px;
    }
    .leaflet-popup-tip { background: #1a1d27; }
    .leaflet-popup-content { margin: 13px 15px; font-size: .9rem; line-height: 1.45; }
    .popup-kicker { font-size: .68rem; letter-spacing: .04em; color: var(--accent); margin: 0 0 5px; }
    .popup-title { font-size: 1.02rem; margin: 0 0 8px; }
    .popup-item { margin: 0 0 10px; }
    .popup-item a { color: var(--ink); }
    .popup-places { color: var(--accent); font-size: .75rem; margin: 3px 0 0; }
    .popup-snip { color: #d8d0c2; font-size: .78rem; margin: 4px 0 0; line-height: 1.4; }
    .popup-src { color: var(--muted); font-size: .75rem; }
    .leaflet-control-attribution { background: rgba(16,18,24,.75) !important; color: #6e675c !important; }
    .leaflet-control-attribution a { color: #8e8576 !important; }
    @media (max-width: 640px) {
      .panel { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 46vh; }
    }
  </style>
</head>

    const TODAY = "2026-09-05";
    const CLUSTERS = [{"title": "Families Mourn Nepal Flood Victims", "place": "Rasuwa", "lat": 28.11279, "lng": 85.29606, "region": "Asia", "hazard": "flood", "articles": [{"title": "Nepal bet nearly everything on hydropower - the floods show why that&#x27;s a problem", "link": "https://www.bbc.co.uk/news/articles/cy0zx368prno?at_medium=RSS&at_campaign=rss", "source": "BBC World", "today": true, "places": ["Rasuwa"], "snippet": ""}, {"title": "Nepal says it will need billions in funding to rebuild after flash floods", "link": "https://www.bbc.co.uk/news/videos/ce8x2401zdeo?at_medium=RSS&at_campaign=rss", "source": "BBC World", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "Why Nepal floods should worry India", "link": "https://www.bbc.co.uk/news/articles/cn8e940gz10o?at_medium=RSS&at_campaign=rss", "source": "BBC Asia", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "Rescuers pull Chinese worker, Nepali woman from flood wreckage alive", "link": "https://www.aljazeera.com/news/2026/9/5/rescuers-pull-chinese-worker-nepali-woman-from-flood-wreckage-alive?traffic_source=rss", "source": "Al Jazeera", "today": true, "places": ["Trishuli 3A", "Rasuwa", "Nuwakot"], "snippet": "Lu Haitao was freed on Saturday from 225 metres inside a flooded tunnel at a hydropower plant in Rasuwa district, in the mountains north of the capital, Kathmandu. Al Jazeera’s Tony Cheng, reporting from Rasuwa district, said rain on Saturday had slowed the search there, though rescue teams were continuing to push ahead."}, {"title": "Relatives hold cremations without bodies for Nepal’s missing flood victims", "link": "https://www.aljazeera.com/features/2026/9/5/relatives-hold-cremations-without-bodies-for-nepals-missing-flood-victims?traffic_source=rss", "source": "Al Jazeera", "today": true, "places": ["Trishuli 3A", "Barhabise", "Chitwan", "Nuwakot", "Rasuwa"], "snippet": "A driver from Barabishe municipality in northern Nepal, Achhami was in Rasuwa – the district hit worst by the floods – at the time the surging waters barrelled down from Tibet. According to Kafle, the bodies have been properly numbered and have been buried at various sites in Chitwan, Nuwakot, Rasuwa, Kathmandu, Pokhara and other regions of Nepal."}, {"title": "Families Turn to Symbolic Cremation After Nepal Floods", "link": "https://www.nytimes.com/2026/09/04/world/asia/nepal-symbolic-cremation-floods.html", "source": "NYT World", "today": true, "places": ["Rasuwa"], "snippet": ""}, {"title": "Families Mourn Nepal Flood Victims", "link": "https://www.nytimes.com/video/world/asia/100000011130555/families-mourn-nepal-flood-victims.html", "source": "NYT World", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "Nepal: Two more people rescued alive", "link": "https://www.france24.com/en/video/20260905-nepal-two-more-people-rescued-alive", "source": "France 24", "today": true, "places": ["Rasuwa"], "snippet": ""}, {"title": "&#x27;I don&#x27;t know if I&#x27;m dreaming&#x27;: Rebuilding lives after Nepal&#x27;s devastating floods", "link": "https://www.france24.com/en/asia-pacific/20260905-i-dont-know-if-im-dreaming-rebuilding-lives-after-nepal-devastating-floods", "source": "France 24", "today": true, "places": ["Rasuwa"], "snippet": "With thousands of people driven from their homes by a massive flash flood that swept entire villages away, FRANCE 24 visits a school in Nepal&#x27;s remote Rasuwa district that has been converted to a temporary shelter for the dispossessed."}, {"title": "Nepal flash floods: Death toll rises to 1,344", "link": "https://www.thehindu.com/news/international/nepal-flash-floods-death-toll-rises-september-5-2026/article71431209.ece", "source": "The Hindu", "today": true, "places": ["Rasuwa"], "snippet": ""}, {"title": "Nepal flash floods: Two more people rescued alive after being trapped for 10 days", "link": "https://www.thehindu.com/news/international/nepal-rescue-operation-after-flash-flood-people-rescued/article71431497.ece", "source": "The Hindu", "today": true, "places": ["Trishuli 3A", "Nuwakot", "Rasuwa"], "snippet": "A woman was saved from a Nuwakot home, and a man from a flood-damaged hydropower project tunnel in Rasuwa Rescuers in Nepal pull Chinese national and woman alive 10 days after devastating floods - The Hindu You are logged in Loading..."}, {"title": "Nepal floods: Indian volunteers take relief to isolated communities as access remains a challenge", "link": "https://www.thehindu.com/news/international/nepal-floods-indian-volunteers-take-relief-to-isolated-communities-as-access-remains-a-challenge/article71428127.ece", "source": "The Hindu", "today": true, "places": ["Rasuwa"], "snippet": "A week after the floods, Indian volunteers are travelling up to 10 hours over damaged mountain roads to reach families who have lost homes and livelihoods, while some areas of Rasuwa remain accessible only by helicopter."}, {"title": "Nepal flood aftermath updates: Nepal announces relief package for flood-hit businesses, plans settlement relocation", "link": "https://www.thehindu.com/news/international/nepal-flash-flood-live-updates-rescue-operations-rasuwa-nuwakot-district-death-toll-missing-persons-news-september-4-2026/article71427024.ece", "source": "The Hindu", "today": true, "places": ["Rasuwa"], "snippet": ""}, {"title": "More than a week after Nepal’s deadliest flood disaster in years, here’s what we know so far", "link": "https://www.thehindu.com/videos/more-than-a-week-after-nepals-deadliest-flood-disaster-in-years-heres-what-we-know-so-far/article71429685.ece", "source": "The Hindu", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "United Nations appeals for $50 million for Nepal flood victims", "link": "https://www.thehindu.com/news/international/united-nations-appeals-for-50-million-for-nepal-flood-victims/article71428201.ece", "source": "The Hindu", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "Eight days and counting: Man searches for his missing brother after Nepal flash floods", "link": "https://www.thehindu.com/videos/8-days-after-nepal-floods-a-brothers-search-for-his-missing-brother/article71428066.ece", "source": "The Hindu", "today": false, "places": ["Rasuwa"], "snippet": "Rishi travelled from Nepal’s Kavre district to Rasuwa in search of his brother, Ang Thung Tamang, a truck driver who went missing after the flash flood on August 26. With no answers, Rishi began searching for his brother himself, eventually reaching Syaphru in Rasuwa."}, {"title": "Nepal floods: Centre to offer DNA profiling services for first-degree relatives of missing persons", "link": "https://www.thehindu.com/news/national/nepal-floods-centre-to-offer-dna-profiling-services-for-first-degree-relatives-of-missing-persons/article71427144.ece", "source": "The Hindu", "today": false, "places": ["Rasuwa"], "snippet": ""}, {"title": "Late rescues renew hope for survivors in deadly Nepal floods", "link": "https://kathmandupost.com/national/2026/09/05/miraculous-rescues-offer-renewed-hope-after-nepal-floods", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Betrawati", "Bidur", "Rasuwa"], "snippet": "A 64-year-old woman was rescued alive from beneath her buried home as her family performed her death rites, while three others—including a Chinese national—were pulled alive from hydropower tunnels in Rasuwa. Chandika Shrestha, 64, a resident of Betrawati in Bidur Municipality-10, had gone missing alongside four members of her family on August 26, when the flash floods tore through the Bhotekoshi river basin, decimating entire settlements."}, {"title": "Flood-displaced mothers struggle for privacy and care", "link": "https://kathmandupost.com/national/2026/09/05/flood-displaced-mothers-struggle-for-privacy-and-care", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli", "Dhading", "Nuwakot", "Rasuwa"], "snippet": "On the morning of August 26, Pariyar fled her home in Trishuli when the floods came and is now staying with dozens of strangers under one roof, where men smoke cigarettes near where she nurses her baby and where sleep, food and privacy all arrive on somebody else’s schedule. We are not getting enough to eat.” Pariyar’s account is part of a much larger and unfinished crisis unfolding in the flood-hit districts along the Bhotekoshi-Trishuli corridor northwest of Kathmandu."}, {"title": "Floods revive questions over an abandoned mountain airstrip", "link": "https://kathmandupost.com/national/2026/09/05/floods-revive-questions-over-an-abandoned-mountain-airstrip", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Langtang", "Trishuli", "Nuwakot", "Rasuwa"], "snippet": "Langtang airport sits at an elevation of 3,658 metres above sea level. During the emergency, helicopters had to operate under military supervision from an open area at the Nepal Army’s training centre in Trishuli."}, {"title": "Nepal PM Balendra Shah to address UN General Assembly on September 24", "link": "https://kathmandupost.com/national/2026/09/05/nepal-pm-balendra-shah-to-address-un-general-assembly-on-september-24", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli River", "Rasuwa"], "snippet": "The plan was revised after the August 26 disaster in Nepal’s northern Himalayan region, when floods triggered by a glacial collapse and landslide swept through communities along the Bhotekoshi and Trishuli river corridors. Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "Where to support flood relief in Kathmandu this week and beyond", "link": "https://kathmandupost.com/art-culture/2026/09/05/where-to-support-flood-relief-in-kathmandu-this-week-and-beyond", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Rasuwa"], "snippet": "Here’s what makes it stand out Editor&#x27;s Picks What triggered the Rasuwa flood? Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "They stopped hoping to find him alive. Then they found a hand", "link": "https://kathmandupost.com/national/2026/09/05/they-stopped-hoping-to-find-him-alive-then-they-found-a-hand", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Chilime", "Chitwan", "Rasuwa"], "snippet": "Raj Kumar Diyali went missing with his wife and four-year-old son in Nepal’s Bhotekoshi flood. Then they found a hand Raj Kumar Diyali went missing with his wife and four-year-old son in Nepal’s Bhotekoshi flood."}, {"title": "Barely saved, he cuts mourning short to help flood survivors", "link": "https://kathmandupost.com/national/2026/09/05/barely-saved-he-cuts-mourning-short-to-help-flood-survivors", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli", "Langtang", "Rasuwa"], "snippet": "Sudip Kumar Neupane watched a raging Trishuli swallow his younger brother and a close colleague, then came out of grief after two days. Sudip Kumar Neupane pictured in Uttargaya, Rasuwa on Thursday."}, {"title": "Nvidia donates $10 million to flood recovery, one of Nepal’s biggest corporate donations", "link": "https://kathmandupost.com/national/2026/09/04/nvidia-donates-10-million-to-flood-recovery-one-of-nepal-s-biggest-corporate-donations", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Amazon", "California", "Rasuwa"], "snippet": "The contribution is the largest financial assistance Nepal has received from a technology company since the Bhotekoshi River flood on August 26 and among the biggest corporate donations to the country’s recovery effort. Its graphics processing units, or GPUs, are used to train and run AI systems at some of the world’s biggest technology companies, including Google, Microsoft, Amazon and Meta."}, {"title": "Road department begins cutting new track to reopen flood-hit Prithvi Highway", "link": "https://kathmandupost.com/national/2026/09/04/road-department-begins-cutting-new-track-to-reopen-flood-hit-prithvi-highway", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Rasuwa"], "snippet": "Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "Nepal home minister tells critics to focus on results, not where he works", "link": "https://kathmandupost.com/national/2026/09/04/nepal-home-minister-tells-critics-to-focus-on-results-not-where-he-works", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Rasuwa"], "snippet": "Gurung travelled by helicopter from Kathmandu to the Trishuli 3A hydropower project in the morning, where two workers trapped underground for nine days were rescued alive. The two workers, Sanjay Sah of Saptari and Kabir Maharjan of Kathmandu, were rescued alive from the Trishuli 3A tunnel on Friday morning."}, {"title": "Prime Minister Balendra Shah, Australia’s Anthony Albanese discuss flood response", "link": "https://kathmandupost.com/national/2026/09/04/prime-minister-balendra-shah-australia-s-anthony-albanese-discuss-flood-response", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Rasuwa"], "snippet": "Shah thanked the Australian government and people for their solidarity following the devastating flood on August 26 in the Bhotekoshi river in Rasuwa district, which caused loss of life and extensive damage to infrastructure and property. Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "How two Nepal hydropower workers survived nine days trapped underground", "link": "https://kathmandupost.com/national/2026/09/04/how-two-nepal-hydropower-workers-survived-nine-days-trapped-underground", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Rasuwa"], "snippet": "Maharjan had gone there for maintenance Maharjan had not been permanently stationed at Trishuli 3A. The two men had been trapped after the Bhotekoshi river flooded the area around the Trishuli 3A project on August 26."}, {"title": "Rescued tunnel worker says he stayed behind to save others", "link": "https://kathmandupost.com/national/2026/09/04/rescued-tunnel-worker-says-he-stayed-behind-to-save-others", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Nuwakot", "Rasuwa"], "snippet": "Sanjay Sah told rescuers he delayed his escape to help others flee after the flood struck the Trishuli 3A tunnel, leaving him trapped inside for nine days. Rescuers pull Sanjay Sah out of the Trishuli 3A hydropower tunnel in Nuwakot on Friday, nine days after he was trapped inside following a flash flood."}, {"title": "Nepal flood survivors pulled alive from hydropower tunnel nine days later", "link": "https://kathmandupost.com/national/2026/09/04/voices-heard-from-inside-trishuli-3a-hydropower-tunnel-says-lawmaker", "source": "Kathmandu Post", "today": false, "places": ["Trishuli 3A", "Bhotekoshi", "Trishuli River", "Rasuwa"], "snippet": "The rescue of two men came after rescuers heard voices from inside the Trishuli 3A tunnel, raising hopes that others trapped since the August 26 disaster may still be alive. The flash flood on August 26 swept through the Trishuli river valley, killing 1,252 people and damaging hydropower projects and key road links."}, {"title": "Nepal unveils relief package to help flood-hit businesses recover", "link": "https://kathmandupost.com/money/2026/09/04/nepal-unveils-relief-package-to-help-flood-hit-businesses-recover", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Nuwakot", "Rasuwa"], "snippet": "Customs and tax breaks, loan restructuring and cheaper credit offered to businesses affected by Bhotekoshi floods. How Nepal is mobilising funds in flood response Prithvi Highway shutdown puts Kathmandu supplies under pressure Rasuwa floods weigh on Nepal’s stock market as hydropower, insurers slide Editor&#x27;s Picks What triggered the Rasuwa flood?"}, {"title": "How engineers in a WhatsApp group are guiding Nepal’s flood rescue efforts", "link": "https://kathmandupost.com/national/2026/09/04/how-engineers-in-a-whatsapp-group-are-guiding-nepal-s-flood-rescue-efforts", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Chilime", "Rasuwagadhi", "Rasuwa"], "snippet": "Rescue team members work to enter the tunnel at the Upper Trishuli 3A Hydropower Station as they search for survivors and retrieve bodies in Rasuwa, Nepal, September 3, 2026. ‘Send me layout drawings’ “Can you send me Chilime layout drawings,” a government official wrote on the engineers’ WhatsApp group on Saturday as rescue workers searched the buried remains of the Chilime hydropower plant high in the Himalayan valley close to the Chinese border."}, {"title": "Nepal Rasuwa Flood Situation Report No. 6", "link": "https://reliefweb.int/report/nepal/nepal-rasuwa-flood-situation-report-no-6", "source": "ReliefWeb", "today": true, "places": ["Rasuwa", "Chitwan", "Dhading", "Gorkha", "Nuwakot"], "snippet": "Access remains the principal constraint, with damaged roads and bridges slowing the movement of relief supplies into upper Rasuwa, and several locations reachable only on foot. The appeal seeks US$49.6 million to provide life-saving assistance to 84,270 people (19,284 households) in 17 municipalities across six districts: Rasuwa, Nuwakot, Dhading, Chitwan, Gorkha and Tanahu."}, {"title": "Nepal: Rasuwa Flood Situation Report No-6 (As of 5 September 2026)", "link": "https://reliefweb.int/report/nepal/nepal-rasuwa-flood-situation-report-no-6-5-september-2026", "source": "ReliefWeb", "today": true, "places": ["Rasuwa", "Dhading", "Nuwakot"], "snippet": "Nepal: Rasuwa Flood Situation Report No-6 (As of 5 September 2026). So far, reports indicate that the Rasuwa floods have claimed 1,259 lives, with 5,083 people still out of contact and 12,038 rescued (NDRRMA, 3 September, 19:00)."}, {"title": "IOM Nepal Flood Response Situation Report #3 | 3 September 2026", "link": "https://reliefweb.int/report/nepal/iom-nepal-flood-response-situation-report-3-3-september-2026", "source": "ReliefWeb", "today": false, "places": ["Nuwakot", "Amazon", "Rasuwa"], "snippet": "In Nuwakot, initial reports indicate that 1,897 households have been displaced, 1,267 houses completely damaged and 1,253 houses partially damaged."}, {"title": "Nepal: Rasuwa Floods (26th August 2026) - Reference Map Series of Affected Area Sheet 01 (04/09/2026)", "link": "https://reliefweb.int/map/nepal/nepal-rasuwa-floods-26th-august-2026-reference-map-series-affected-area-sheet-01-04092026", "source": "ReliefWeb", "today": false, "places": ["Rasuwa", "Bidur", "Dhading"], "snippet": "Nepal: Rasuwa Floods (26th August 2026) - Reference Map Series of Affected Area Sheet 01 (04/09/2026). Nepal: Rasuwa Floods (26th August 2026) - Reference Map Series of Affected Area Sheet 01 (04/09/2026) - Nepal | ReliefWeb Skip to main content Help Log in ReliefWeb Content Search What are you looking for?"}, {"title": "Nepal — Flash Floods — Displacement Snapshot (27–31 August 2026)", "link": "https://reliefweb.int/report/nepal/nepal-flash-floods-displacement-snapshot-27- tle": "Nepal flood disaster puts climate justice under spotlight", "link": "https://www.dw.com/en/nepal-flood-disaster-puts-climate-justice-under-spotlight/a-78998617?maca=en-rss-en-world-4025-rdf", "source": "DW", "today": false, "places": ["Bhotekoshi", "Trishuli River", "Trishuli 3A"], "snippet": "Catastrophe 09/04/2026 September 4, 2026 After Nepal floods, survivors return to ruins of their homes Along Nepal&#x27;s Trishuli River, rescuers continue to search through debris as survivors return to devastated com"}, {"title": "Panel formed to conduct PNDA has six weeks to prepare report", "link": "https://kathmandupost.com/national/2026/09/05/panel-formed-to-conduct-pnda-has-six-weeks-to-prepare-report", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Bidur", "Dhading", "Gorkha", "Nuwakot"], "snippet": "According to the United Nations Development Programme, the estimated affected population is 84,270 over 17 municipalities in the six districts of Rasuwa, Nuwakot, Dhading, Chitawan, Gorkha and Tanahu. Preliminary modelling estimates approximately $170 million in potential damage to residential and commercial buildings along the Rasuwa and Nuwakot river valleys."}, {"title": "Late rescues renew hope for survivors in deadly Nepal floods", "link": "https://kathmandupost.com/national/2026/09/05/miraculous-rescues-offer-renewed-hope-after-nepal-floods", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Betrawati", "Bidur", "Rasuwa"], "snippet": "A 64-year-old woman was rescued alive from beneath her buried home as her family performed her death rites, while three others—including a Chinese national—were pulled alive from hydropower tunnels in Rasuwa. Chandika Shrestha, 64, a resident of Betrawati in Bidur Municipality-10, had gone missing alongside four members of her family on August 26, when the flash floods tore through the Bhotekoshi river basin, decimating entire settlements."}, {"title": "Flood-displaced mothers struggle for privacy and care", "link": "https://kathmandupost.com/national/2026/09/05/flood-displaced-mothers-struggle-for-privacy-and-care", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli", "Dhading", "Nuwakot", "Rasuwa"], "snippet": "On the morning of August 26, Pariyar fled her home in Trishuli when the floods came and is now staying with dozens of strangers under one roof, where men smoke cigarettes near where she nurses her baby and where sleep, food and privacy all arrive on somebody else’s schedule. We are not getting enough to eat.” Pariyar’s account is part of a much larger and unfinished crisis unfolding in the flood-hit districts along the Bhotekoshi-Trishuli corridor northwest of Kathmandu."}, {"title": "Floods revive questions over an abandoned mountain airstrip", "link": "https://kathmandupost.com/national/2026/09/05/floods-revive-questions-over-an-abandoned-mountain-airstrip", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Langtang", "Trishuli", "Nuwakot", "Rasuwa"], "snippet": "Langtang airport sits at an elevation of 3,658 metres above sea level. During the emergency, helicopters had to operate under military supervision from an open area at the Nepal Army’s training centre in Trishuli."}, {"title": "Security personnel install Nepali flag on the border with China in Rasuwagadhi", "link": "https://kathmandupost.com/national/2026/09/05/security-personnel-install-nepali-flag-on-the-border-with-china-in-rasuwagadhi", "source": "Kathmandu Post", "today": false, "places": ["Rasuwagadhi", "Bhotekoshi", "Nepal-Tibet border", "Trishuli River", "Timure"], "snippet": "Security personnel install Nepali flag on the border with China in Rasuwagadhi. With the entire settlement at the bordering town swept away by last week’s devastating floods, there was nothing that separated the Nepali territory from that of China in Rasuwagadhi."}, {"title": "Two people rescued alive on 11th day after floods", "link": "https://kathmandupost.com/national/2026/09/05/two-people-rescued-alive-on-11th-day-after-floods", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Betrawati", "Bidur", "Nuwakot"], "snippet": "A Chinese national was pulled from a hydropower tunnel in Rasuwa, while a 64-year-old woman was rescued from the upper floor of a house in Nuwakot. bookmark facebook twitter Whatsapp mail Post Report Published at : September 5, 2026 Updated at : September 5, 2026 15:48 Kathmandu Two people were rescued alive on Saturday, 11 days after devastating floods in Nepal’s Bhotekoshi River left them missing."}, {"title": "Where rescue efforts stand at flood-hit hydropower projects", "link": "https://kathmandupost.com/national/2026/09/05/where-rescue-efforts-stand-at-flood-hit-hydropower-projects", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Chilime", "Mailung", "Rasuwagadhi"], "snippet": "Rescue operation underway for people trapped inside the Trishuli 3A hydropower project tunnel. The damaged facilities include the Upper Trishuli-1, Upper Trishuli-3A, Upper Trishuli-3B, Langtang Khola, Trishuli, Devighat, Mailung Khola, Chilime and Rasuwagadhi hydropower projects, as well as Trishuli Ganga, Rasuwa Bhotekoshi and Nuwakot Solar."}, {"title": "NEPSE falls as flood concerns weigh on insurance, hydropower", "link": "https://kathmandupost.com/money/2026/09/05/nepse-falls-as-flood-concerns-weigh-on-insurance-hydropower", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Mailung", "Rasuwagadhi", "Nuwakot"], "snippet": "Insurance and hydropower under pressure Non-life insurance was the worst-performing sector as investors weighed the potential cost of claims arising from the Bhotekoshi disaster. Hydropower stocks dominated trading by volume, with Rasuwagadhi Hydropower recording 1.162 million shares changing hands, followed by Ridi Power with 1.027 million and Shivam Cements with 944,000."}, {"title": "Nepal flood death toll reaches 1,342", "link": "https://kathmandupost.com/national/2026/09/05/nepal-flood-death-toll-reaches-1-342", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Chitwan", "Dhading", "Gorkha", "Nuwakot"], "snippet": "The bodies were recovered across eight districts, including 360 in Chitwan, 230 in Nawalparasi West, 222 in Nawalparasi East, 192 in Nuwakot, 160 in Rasuwa, 73 in Gorkha, 67 in Dhading and 38 in Tanahun, according to the police. The floods struck along the Bhotekoshi river in Rasuwa district, near Nepal’s northern border with China, causing widespread destruction downstream."}, {"title": "Nepal PM Balendra Shah to address UN General Assembly on September 24", "link": "https://kathmandupost.com/national/2026/09/05/nepal-pm-balendra-shah-to-address-un-general-assembly-on-september-24", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli River", "Rasuwa"], "snippet": "The plan was revised after the August 26 disaster in Nepal’s northern Himalayan region, when floods triggered by a glacial collapse and landslide swept through communities along the Bhotekoshi and Trishuli river corridors. Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "Where to support flood relief in Kathmandu this week and beyond", "link": "https://kathmandupost.com/art-culture/2026/09/05/where-to-support-flood-relief-in-kathmandu-this-week-and-beyond", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Rasuwa"], "snippet": "Here’s what makes it stand out Editor&#x27;s Picks What triggered the Rasuwa flood? Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "They stopped hoping to find him alive. Then they found a hand", "link": "https://kathmandupost.com/national/2026/09/05/they-stopped-hoping-to-find-him-alive-then-they-found-a-hand", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Chilime", "Chitwan", "Rasuwa"], "snippet": "Raj Kumar Diyali went missing with his wife and four-year-old son in Nepal’s Bhotekoshi flood. Then they found a hand Raj Kumar Diyali went missing with his wife and four-year-old son in Nepal’s Bhotekoshi flood."}, {"title": "Barely saved, he cuts mourning short to help flood survivors", "link": "https://kathmandupost.com/national/2026/09/05/barely-saved-he-cuts-mourning-short-to-help-flood-survivors", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli", "Langtang", "Rasuwa"], "snippet": "Sudip Kumar Neupane watched a raging Trishuli swallow his younger brother and a close colleague, then came out of grief after two days. Sudip Kumar Neupane pictured in Uttargaya, Rasuwa on Thursday."}, {"title": "Five of 15 drinking water sources in flood-hit Bidur contaminated with E. coli", "link": "https://kathmandupost.com/health/2026/09/04/five-of-15-drinking-water-sources-in-flood-hit-bidur-contaminated-with-e-coli", "source": "Kathmandu Post", "today": false, "places": ["Bidur", "Bhotekoshi", "Dhading", "Gorkha", "Nuwakot"], "snippet": "Five of 15 drinking water sources in flood-hit Bidur contaminated with E. Nepal Photo Library bookmark facebook twitter Whatsapp mail Arjun Poudel Published at : September 4, 2026 Updated at : September 4, 2026 19:01 Five of 15 drinking water samples collected from various sources in flood-hit Bidur Municipality in Nuwakot district have been found contaminated with E."}, {"title": "Nvidia donates $10 million to flood recovery, one of Nepal’s biggest corporate donations", "link": "https://kathmandupost.com/national/2026/09/04/nvidia-donates-10-million-to-flood-recovery-one-of-nepal-s-biggest-corporate-donations", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Amazon", "California", "Rasuwa"], "snippet": "The contribution is the largest financial assistance Nepal has received from a technology company since the Bhotekoshi River flood on August 26 and among the biggest corporate donations to the country’s recovery effort. Its graphics processing units, or GPUs, are used to train and run AI systems at some of the world’s biggest technology companies, including Google, Microsoft, Amazon and Meta."}, {"title": "Road department begins cutting new track to reopen flood-hit Prithvi Highway", "link": "https://kathmandupost.com/national/2026/09/04/road-department-begins-cutting-new-track-to-reopen-flood-hit-prithvi-highway", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Rasuwa"], "snippet": "Nepal keeps starting over In a settlement destroyed by the Bhotekoshi flood, a disabled couple offer strangers the little they have Nepal working on detailed assessment as Bhotekoshi flood reconstruction could cost up to $5 billion Rabindra Dhant gave Nepal a reason to smile."}, {"title": "Nepal home minister tells critics to focus on results, not where he works", "link": "https://kathmandupost.com/national/2026/09/04/nepal-home-minister-tells-critics-to-focus-on-results-not-where-he-works", "source": "Kathmandu Post", "today": false, "places": ["Bhotekoshi", "Trishuli 3A", "Rasuwa"], "snippet": "Gurung travelled by helicopter from Kathmandu to the Trishuli 3A hydropower project in the morning, where two workers trapped underground for nine days were rescued alive. The two workers, Sanjay Sah of Saptari and Kabir Maharjan of Kathmandu, were rescued alive from the Trishuli 3A tunnel on Friday morning."}, {"title": "Nepal flood death toll reaches 1,287", "link": "https://kathmandupost.com/national/2026/09/04/nepal-flood-death-toll-r     const HAZARD_COLOR = {"wildfire": "#d4784a", "flood": "#6a9ec4", "earthquake": "#c4898a", "cyclone": "#8aa0c4", "tornado": "#9b8ac4", "volcano": "#c45a3a", "landslide": "#9b8a6a", "tsunami": "#4a7a8c", "avalanche": "#c4d0d8", "technogenic": "#c4a85a"};
    const map = L.map("map", { zoomControl: true, minZoom: 2 }).setView([20, 15], 2);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri · wires + ReliefWeb",
      maxZoom: 19
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const hazards = ["all"].concat([...new Set(CLUSTERS.map(c => c.hazard))].sort());
    const hazardSel = document.getElementById("hazard");
    hazardSel.innerHTML = hazards.map(h => '<option value="' + h + '">' + (h === "all" ? "All hazards" : h) + "</option>").join("");
    const regions = ["all"].concat([...new Set(CLUSTERS.map(c => c.region))].sort());
    const regionSel = document.getElementById("region");
    regionSel.innerHTML = regions.map(r => '<option value="' + r + '">' + (r === "all" ? "All regions" : r) + "</option>").join("");
    const placeSel = document.getElementById("place");
    document.getElementById("legend").innerHTML = Object.keys(HAZARD_COLOR).filter(h => CLUSTERS.some(c => c.hazard === h)).map(h =>
      '<span><i class="swatch" style="background:' + HAZARD_COLOR[h] + '"></i>' + h + "</span>"
    ).join("");
    function filtered() {
      const hazard = hazardSel.value, region = regionSel.value, place = placeSel.value;
      return CLUSTERS.filter(c => {
        if (hazard !== "all" && c.hazard !== hazard) return false;
        if (region !== "all" && c.region !== region) return false;
        if (place !== "all" && c.place !== place) return false;
        return true;
      });
    }
    function placesFor() {
      const names = [...new Set(filtered().map(c => c.place))].sort();
      const keep = placeSel.value;
      placeSel.innerHTML = '<option value="all">All places</option>' + names.map(n => '<option>' + n + "</option>").join("");
      if (names.indexOf(keep) !== -1) placeSel.value = keep;
    }
    function render() {
      layer.clearLayers();
      const shown = filtered();
      document.getElementById("count").textContent = shown.length;
      shown.forEach(c => {
        const r = Math.min(16, 7 + c.articles.length * 1.6);
        const m = L.circleMarker([c.lat, c.lng], {
          radius: r, color: "#0b0c10", weight: 1,
          fillColor: HAZARD_COLOR[c.hazard] || "#d4b483", fillOpacity: 0.92
        });
        const items = c.articles.map(a => {
          const where = (a.places && a.places.length) ? '<p class="popup-places">' + a.places.join(" · ") + "</p>" : "";
          const snip = a.snippet ? '<p class="popup-snip">' + a.snippet + "</p>" : "";
          return '<p class="popup-item"><a href="' + a.link + '" target="_blank" rel="noopener">' + a.title +
            "</a>" + where + snip + '<span class="popup-src">' + a.source + (a.today ? " · today" : "") + "</span></p>";
        }).join("");
        m.bindPopup(
          '<p class="popup-kicker">' + c.hazard + " · " + c.place + " · " + c.articles.length + " headline" + (c.articles.length > 1 ? "s" : "") + "</p>" +
          '<p class="popup-title">' + c.title + "</p>" + items
        );
        m.addTo(layer);
      });
    }
    hazardSel.addEventListener("change", function () { placesFor(); render(); });
    regionSel.addEventListener("change", function () { placesFor(); render(); });
    placeSel.addEventListener("change", render);
    document.getElementById("world").onclick = function () { map.setView([20, 15], 2); };
    document.getElementById("asia").onclick = function () { map.setView([28, 90], 4); };
    document.getElementById("americas").onclick = function () { map.setView([15, -80], 3); };
    placesFor();
    render();
    if (CLUSTERS.length) {
      map.fitBounds(CLUSTERS.map(c => [c.lat, c.lng]), { padding: [40, 40], maxZoom: 4 });
    }
  </script>
