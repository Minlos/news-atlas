<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disaster atlas — wildfires, floods, quakes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #efe6d6; --muted: #9b917f; --paper: #101218;
      --panel: rgba(22, 25, 34, .92); --line: #323848; --accent: #d4b07a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
      font-family: Georgia, "Iowan Old Style", Palatino, serif; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #101218; font-family: inherit; }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.3); }
    .panel {
      position: absolute; z-index: 500; top: 14px; left: 14px;
      width: min(400px, calc(100vw - 28px));
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 18px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
      max-height: calc(100vh - 28px); overflow: auto;
    }
    h1 { font-size: 1.28rem; font-weight: 600; margin: 0 2px 2px; }
    .sub { color: var(--muted); font-size: .8rem; line-height: 1.5; margin: 0 0 14px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: .75rem; color: var(--muted); }
    .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
    label { display: block; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin: 11px 0 5px; }
    select, button {
      width: 100%; background: #12141c; color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: .86rem;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { cursor: pointer; }
    .row button:hover { border-color: var(--accent); color: var(--accent); }
    .count { color: var(--accent); font-variant-numeric: tabular-nums; }
    .leaflet-popup-content-wrapper {
      background: #1a1d27; color: var(--ink); border-radius: 12px;
      border: 1px solid var(--line); max-width: 340px;
    }
    .leaflet-popup-tip { background: #1a1d27; }
    .leaflet-popup-content { margin: 13px 15px; font-size: .9rem; line-height: 1.45; }
    .popup-kicker { font-size: .68rem; letter-spacing: .04em; color: var(--accent); margin: 0 0 5px; }
    .popup-title { font-size: 1.02rem; margin: 0 0 8px; }
    .popup-item { margin: 0 0 7px; }
    .popup-item a { color: var(--ink); }
    .popup-src { color: var(--muted); font-size: .75rem; }
    .leaflet-control-attribution { background: rgba(16,18,24,.75) !important; color: #6e675c !important; }
    .leaflet-control-attribution a { color: #8e8576 !important; }
    @media (max-width: 640px) {
      .panel { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 46vh; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <h1>Disaster atlas</h1>
    <p class="sub"><span class="count" id="count"></span> things happening now: fires, floods, quakes, storms. Last 7 days. Politics and explainers stay off.</p>
    <label for="hazard">Hazard</label>
    <select id="hazard"></select>
    <label for="region">Region</label>
    <select id="region"></select>
    <label for="place">Place</label>
    <select id="place"></select>
    <div class="row">
      <button type="button" id="world">World</button>
      <button type="button" id="asia">Asia</button>
      <button type="button" id="americas">Americas</button>
    </div>
    <div class="legend" id="legend"></div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const TODAY = "2026-09-05";
    const CLUSTERS = [{"title": "Families Mourn Nepal Flood Victims", "place": "Nepal", "lat": 27.7172, "lng": 85.324, "region": "Asia", "hazard": "flood", "articles": [{"title": "'A rare moment of joy': Nepal tunnel rescues bring hope for more flood survivors", "link": "https://www.bbc.co.uk/news/videos/cd79vp91321o?at_medium=RSS&at_campaign=rss", "source": "BBC World", "today": false}, {"title": "Watch: Moment workers are rescued from Nepal tunnel", "link": "https://www.bbc.co.uk/news/videos/cnvl5e6vy8eo?at_medium=RSS&at_campaign=rss", "source": "BBC World", "today": false}, {"title": "Nepal says it will need billions in funding to rebuild after flash floods", "link": "https://www.bbc.co.uk/news/videos/ce8x2401zdeo?at_medium=RSS&at_campaign=rss", "source": "BBC World", "today": false}, {"title": "Rescuers in Nepal find two more people alive after flash flood disaster", "link": "https://www.theguardian.com/world/2026/sep/05/rescuers-nepal-find-two-more-people-alive-flood-disaster", "source": "The Guardian", "today": true}, {"title": "Two workers pulled alive from tunnel nine days after Nepal-Tibet floods", "link": "https://www.theguardian.com/world/2026/sep/04/nepal-tunnel-found-alive-flood-two-workers-hydropower-rescue", "source": "The Guardian", "today": false}, {"title": "Dozens of trapped hydropower tunnel workers in Nepal could still be alive, official says", "link": "https://www.theguardian.com/world/2026/sep/03/nepal-floods-rasuwagadhi-hydropower-hydro-tunnel-trapped-workers-search-rescue", "source": "The Guardian", "today": false}, {"title": "Relief as five Australians missing in Nepal-Tibet flood disaster found alive", "link": "https://www.theguardian.com/world/2026/sep/01/missing-australian-found-alive-nepal-tibet-floods", "source": "The Guardian", "today": false}, {"title": "What we know about the link between Nepal’s flash floods and our climate crisis", "link": "https://www.theguardian.com/environment/2026/sep/03/what-we-know-about-the-link-between-nepals-flash-floods-and-our-climate-crisis", "source": "Guardian environment", "today": false}, {"title": "Rescuers pull Chinese worker, Nepali woman from flood wreckage alive", "link": "https://www.aljazeera.com/news/2026/9/5/rescuers-pull-chinese-worker-nepali-woman-from-flood-wreckage-alive?traffic_source=rss", "source": "Al Jazeera", "today": true}, {"title": "Relatives hold cremations without bodies for Nepal’s missing flood victims", "link": "https://www.aljazeera.com/features/2026/9/5/relatives-hold-cremations-without-bodies-for-nepals-missing-flood-victims?traffic_source=rss", "source": "Al Jazeera", "today": true}, {"title": "Nepal Floods Buried a House. The Woman Inside Was Still Alive.", "link": "https://www.nytimes.com/2026/09/05/world/asia/nepal-floods-chinese-worker-rescue.html", "source": "NYT World", "today": true}, {"title": "Families Turn to Symbolic Cremation After Nepal Floods", "link": "https://www.nytimes.com/2026/09/04/world/asia/nepal-symbolic-cremation-floods.html", "source": "NYT World", "today": true}, {"title": "9 Days After Flood, 2 Men Are Pulled Alive From Mud-Filled Tunnels in Nepal", "link": "https://www.nytimes.com/2026/09/04/world/asia/nepal-flood-tunnel-rescue.html", "source": "NYT World", "today": true}, {"title": "Families Mourn Nepal Flood Victims", "link": "https://www.nytimes.com/video/world/asia/100000011130555/families-mourn-nepal-flood-victims.html", "source": "NYT World", "today": false}, {"title": "Workers Rescued From Tunnel in Nepal 9 Days After Flood", "link": "https://www.nytimes.com/2026/09/04/world/asia/nepal-floods-rescue-tunnel-worker.html", "source": "NYT World", "today": false}, {"title": "Chinese national rescued from Nepal tunnel 10 days after flash flood", "link": "https://www.france24.com/en/video/20260905-chinese-national-rescued-from-nepal-tunnel-10-days-after-flash-flood", "source": "France 24", "today": true}, {"title": "Nepal: Two more people rescued alive", "link": "https://www.france24.com/en/video/20260905-nepal-two-more-people-rescued-alive", "source": "France 24", "today": true}, {"title": "Two Nepal rescues revive hopes 10 days after flood", "link": "https://www.france24.com/en/video/20260905-two-nepal-rescues-revive-hopes-10-days-after-flood", "source": "France 24", "today": true}, {"title": "'I don't know if I'm dreaming': Rebuilding lives after Nepal's devastating floods", "link": "https://www.france24.com/en/asia-pacific/20260905-i-dont-know-if-im-dreaming-rebuilding-lives-after-nepal-devastating-floods", "source": "France 24", "today": true}, {"title": "Nepal: Temporary education centres help flood-displaced children", "link": "https://www.france24.com/en/video/20260905-nepal-temporary-education-centres-help-flood-displaced-children", "source": "France 24", "today": true}, {"title": "Nepal Rasuwa Flood Situation Report No. 6", "link": "https://reliefweb.int/report/nepal/nepal-rasuwa-flood-situation-report-no-6", "source": "ReliefWeb", "today": true}, {"title": "Nepal: Rasuwa Flood Situation Report No-6 (As of 5 September 2026)", "link": "https://reliefweb.int/report/nepal/nepal-rasuwa-flood-situation-report-no-6-5-september-2026", "source": "ReliefWeb", "today": true}, {"title": "IOM Nepal Flood Response Situation Report #3 | 3 September 2026", "link": "https://reliefweb.int/report/nepal/iom-nepal-flood-response-situation-report-3-3-september-2026", "source": "ReliefWeb", "today": false}, {"title": "Nepal — Flash Floods — Displacement Snapshot (27–31 August 2026)", "link": "https://reliefweb.int/report/nepal/nepal-flash-floods-displacement-snapshot-27-31-august-2026", "source": "ReliefWeb", "today": false}]}, {"title": "Haze From Indonesian Wildfires Blankets Parts of Malaysia and Philippines", "place": "Indonesia", "lat": -6.2088, "lng": 106.8456, "region": "Asia", "hazard": "wildfire", "articles": [{"title": "Haze From Indonesian Wildfires Blankets Parts of Malaysia and Philippines", "link": "https://www.nytimes.com/2026/09/04/world/asia/malaysia-philippines-haze-indonesia-singapore-wildfires.html", "source": "NYT World", "today": false}]}, {"title": "Philippines | Southwest Monsoon and recent tropical cyclone activity - DG ECHO Daily Map | 04/09/2026", "place": "Philippines", "lat": 14.5995, "lng": 120.9842, "region": "Asia", "hazard": "cyclone", "articles": [{"title": "Philippines | Southwest Monsoon and recent tropical cyclone activity - DG ECHO Daily Map | 04/09/2026", "link": "https://reliefweb.int/map/philippines/philippines-southwest-monsoon-and-recent-tropical-cyclone-activity-dg-echo-daily-map-04092026", "source": "ReliefWeb", "today": false}]}];
    const HAZARD_COLOR = {"wildfire": "#d4784a", "flood": "#6a9ec4", "earthquake": "#c4898a", "cyclone": "#8aa0c4", "tornado": "#9b8ac4", "volcano": "#c45a3a", "landslide": "#9b8a6a", "tsunami": "#4a7a8c", "avalanche": "#c4d0d8"};
    const map = L.map("map", { zoomControl: true, minZoom: 2 }).setView([20, 15], 2);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri · wires + ReliefWeb",
      maxZoom: 19
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const hazards = ["all"].concat([...new Set(CLUSTERS.map(c => c.hazard))].sort());
    const hazardSel = document.getElementById("hazard");
    hazardSel.innerHTML = hazards.map(h => '<option value="' + h + '">' + (h === "all" ? "All hazards" : h) + "</option>").join("");
    const regions = ["all"].concat([...new Set(CLUSTERS.map(c => c.region))].sort());
    const regionSel = document.getElementById("region");
    regionSel.innerHTML = regions.map(r => '<option value="' + r + '">' + (r === "all" ? "All regions" : r) + "</option>").join("");
    const placeSel = document.getElementById("place");
    document.getElementById("legend").innerHTML = Object.keys(HAZARD_COLOR).filter(h => CLUSTERS.some(c => c.hazard === h)).map(h =>
      '<span><i class="swatch" style="background:' + HAZARD_COLOR[h] + '"></i>' + h + "</span>"
    ).join("");
    function filtered() {
      const hazard = hazardSel.value, region = regionSel.value, place = placeSel.value;
      return CLUSTERS.filter(c => {
        if (hazard !== "all" && c.hazard !== hazard) return false;
        if (region !== "all" && c.region !== region) return false;
        if (place !== "all" && c.place !== place) return false;
        return true;
      });
    }
    function placesFor() {
      const names = [...new Set(filtered().map(c => c.place))].sort();
      const keep = placeSel.value;
      placeSel.innerHTML = '<option value="all">All places</option>' + names.map(n => '<option>' + n + "</option>").join("");
      if (names.indexOf(keep) !== -1) placeSel.value = keep;
    }
    function render() {
      layer.clearLayers();
      const shown = filtered();
      document.getElementById("count").textContent = shown.length;
      shown.forEach(c => {
        const r = Math.min(16, 7 + c.articles.length * 1.6);
        const m = L.circleMarker([c.lat, c.lng], {
          radius: r, color: "#0b0c10", weight: 1,
          fillColor: HAZARD_COLOR[c.hazard] || "#d4b483", fillOpacity: 0.92
        });
        const items = c.articles.map(a =>
          '<p class="popup-item"><a href="' + a.link + '" target="_blank" rel="noopener">' + a.title +
          '</a><br><span class="popup-src">' + a.source + (a.today ? " · today" : "") + "</span></p>"
        ).join("");
        m.bindPopup(
          '<p class="popup-kicker">' + c.hazard + " · " + c.place + " · " + c.articles.length + " headline" + (c.articles.length > 1 ? "s" : "") + "</p>" +
          '<p class="popup-title">' + c.title + "</p>" + items
        );
        m.addTo(layer);
      });
    }
    hazardSel.addEventListener("change", function () { placesFor(); render(); });
    regionSel.addEventListener("change", function () { placesFor(); render(); });
    placeSel.addEventListener("change", render);
    document.getElementById("world").onclick = function () { map.setView([20, 15], 2); };
    document.getElementById("asia").onclick = function () { map.setView([28, 90], 4); };
    document.getElementById("americas").onclick = function () { map.setView([15, -80], 3); };
    placesFor();
    render();
  </script>
</body>
</html>
